<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Matglas — podcastpagina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#0F1012}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.ph{--bg:#0F1012;--s1:#17181B;--s2:#1F2024;--s3:#292A2F;--line:#24252A;--ink:#F0F0F2;--ink2:#A9ABB2;--rise:#5BCB8F;--fall:#FF7A93;width:390px;height:1180px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.pal-red{--acc:#FF8F80;--glass:rgba(58,30,28,.9)}
.pal-teal{--acc:#5CD6D1;--glass:rgba(20,44,44,.9)}
.pal-amber{--acc:#F5C451;--glass:rgba(31,32,36,.9)}
.dsp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.gl{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.cov{position:relative;overflow:hidden;box-sizing:border-box;flex:none}
.cov .ct{position:absolute;left:9%;top:8%;right:9%;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;line-height:.95;text-transform:uppercase;letter-spacing:.01em;z-index:2}
.cv-red{background:radial-gradient(circle at 74% 60%,#F6B39E 0 10%,transparent 10.5%),linear-gradient(170deg,#D8452F 0%,#A42A1F 55%,#5E130E 100%)}
.cv-red::after{content:'';position:absolute;inset:auto 0 0 0;height:36%;background:#2A0907;clip-path:polygon(0 42%,16% 30%,29% 46%,47% 18%,63% 38%,81% 24%,100% 44%,100% 100%,0 100%)}
.cv-red .ct{color:#FFF1EC}
.cv-teal{background:radial-gradient(circle at 50% -10%,#8FE6DB 0,#2A9C98 34%,#0E4F5A 68%,#06222B 100%)}
.cv-teal::after{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 125%,rgba(255,255,255,.13) 0 1.5%,transparent 1.5% 8%)}
.cv-teal .ct{color:#EFFFFD}
.cv-amber{background:linear-gradient(160deg,#F9D05C,#E39E1E 60%,#AC650F)}
.cv-amber::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 74% 78%,#3B2208 0 27%,#6B3F0E 27.5% 29%,#3B2208 29.5% 33%,transparent 33.5%)}
.cv-amber .ct{color:#2B1804}
.blur{position:absolute;left:-80px;right:-80px;top:-80px;height:640px;filter:blur(56px) saturate(1.1) brightness(.5)}
.fade{position:absolute;left:0;right:0;top:0;height:600px;background:linear-gradient(180deg,rgba(15,16,18,.15) 0%,rgba(15,16,18,.55) 55%,#0F1012 100%)}
.btn{white-space:nowrap;height:44px;border-radius:22px;padding:0 20px;display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.btn-w{background:#F0F0F2;color:#111214}
.btn-g{color:var(--ink)}
.tab{height:48px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--ink2);position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.ep{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.meta{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.play{width:44px;height:44px;border-radius:22px;background:var(--s2);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:4px;border-radius:2px;background:var(--s3);width:64px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.mini{position:absolute;left:10px;right:10px;bottom:76px;height:62px;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);display:flex;align-items:center;gap:12px;padding:0 6px 0 9px;overflow:hidden}
.mini .pg{position:absolute;left:0;bottom:0;height:2px;background:var(--acc)}
.nav{position:absolute;left:0;right:0;bottom:0;height:68px;background:rgba(15,16,18,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.nv.on{color:var(--ink)}
.nv .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nv.on .pill{background:rgba(255,255,255,.14)}
</style>
</helmet>
<div class="ph {{c.pal}}">
  <div class="cov blur {{c.cls}}"></div>
  <div class="fade"></div>

  <div style="position: relative; display: flex; align-items: center; padding: 28px 10px 0 10px; height: 56px; gap: 8px">
    <button class="ib gl" aria-label="Terug"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button>
    <div style="flex-grow: 1"></div>
    <button class="ib gl" aria-label="Delen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"></circle><circle cx="6" cy="12" r="2.6"></circle><circle cx="18" cy="19" r="2.6"></circle><path d="M8.3 10.8l7.4-4.3"></path><path d="M8.3 13.2l7.4 4.3"></path></svg></button>
    <button class="ib gl" aria-label="Meer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 14px 24px 0 24px">
    <button aria-label="Andere hoes proberen" onClick="{{next}}" style="border-radius: 14px; box-shadow: 0 24px 50px rgba(0,0,0,.5)">
      <div class="cov {{c.cls}}" style="width: 212px; height: 212px; border-radius: 14px"><div class="ct" style="font-size: 25px">{{c.title}}</div></div>
    </button>
    <h1 class="dsp" style="margin: 22px 0 0 0; font-size: 28px; line-height: 1.12; font-weight: 700; text-align: center">{{c.title}}</h1>
    <div style="margin-top: 6px; font-size: 14px; color: rgba(240,240,242,.78)">{{c.pub}} · {{c.genre}} · wekelijks</div>
    <div style="display: flex; gap: 10px; margin-top: 18px; align-items: center">
      <button class="btn btn-w"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Volgen</button>
      <button class="btn btn-g gl"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"></path></svg>Nieuwste afl.</button>
      <button class="ib gl" aria-label="Meldingen"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 10-12 0c0 5-2 6-2 6h16s-2-1-2-6"></path><path d="M13.7 20a2 2 0 01-3.4 0"></path></svg></button>
    </div>
  </div>

  <div class="gl" style="position: relative; margin: 22px 20px 0 20px; border-radius: 16px; display: flex; align-items: center; padding: 12px 8px 12px 16px; gap: 14px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08)">
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="display: flex; align-items: baseline; gap: 8px"><span class="dsp" style="font-size: 20px; font-weight: 700">#3</span><span style="font-size: 14px; color: var(--ink2)">{{c.genre}} · Apple NL</span><span style="font-size: 12px; font-weight: 700; color: var(--rise)">▲ 2</span></div>
      <div style="display: flex; align-items: baseline; gap: 8px"><span class="dsp" style="font-size: 20px; font-weight: 700">#7</span><span style="font-size: 14px; color: var(--ink2)">Alle podcasts · Spotify NL</span><span style="font-size: 12px; font-weight: 700; color: var(--ink2)">= 0</span></div>
    </div>
    <button class="ib" aria-label="Noteringen bekijken"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
  </div>

  <p style="position: relative; margin: 18px 20px 0 20px; font-size: 14px; line-height: 1.5; color: var(--ink2)">{{c.desc}} <b style="color: var(--ink); font-weight: 650">Meer</b></p>

  <div style="position: relative; margin-top: 12px; padding: 0 20px; display: flex; gap: 26px; border-bottom: 1px solid var(--line)">
    <div class="tab on">Afleveringen</div><div class="tab">Noteringen</div><div class="tab">Over</div>
  </div>

  <sc-for list="{{c.eps}}" as="e" hint-placeholder-count="5">
    <div class="ep">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px">
        <div class="meta">{{e.meta}}</div>
        <div style="font-size: 16px; font-weight: 600; line-height: 1.3">{{e.title}}</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2)">
          <sc-if value="{{e.prog}}" hint-placeholder-val="{{false}}"><div class="bar"><i style="width: {{e.prog}}"></i></div></sc-if>
          <span>{{e.dur}}</span>
        </div>
      </div>
      <button class="play" aria-label="Afspelen"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></button>
    </div>
  </sc-for>

  <div class="mini">
    <div class="cov {{c.cls}}" style="width: 44px; height: 44px; border-radius: 10px"></div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.eps.1.title}}</div>
      <div style="font-size: 12px; color: rgba(240,240,242,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}} · nog 18 min</div>
    </div>
    <button class="ib" aria-label="Pauzeren"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.3"></rect><rect x="13.5" y="5" width="4" height="14" rx="1.3"></rect></svg></button>
    <button class="ib" aria-label="30 seconden vooruit"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.3-5.7"></path><path d="M20 4v4.5h-4.5"></path></svg></button>
    <div class="pg" style="width: 58%"></div>
  </div>

  <nav class="nav">
    <div class="nv on"><div class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-7"></path><path d="M12 20V4"></path><path d="M19 20v-11"></path></svg></div>Hitlijsten</div>
    <div class="nv"><div class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M15 9l-2 4.2L9 15l2-4.2z"></path></svg></div>Ontdek</div>
    <div class="nv"><div class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14"></path><path d="M9.5 5v14"></path><path d="M14.5 6.2l5 12.8"></path></svg></div>Bibliotheek</div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hoes":{"editor":"enum","options":["rood","blauwgroen","amber"],"default":"rood"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  renderVals() {
    const covers = [
      { pal: 'pal-red', cls: 'cv-red', title: 'Het Verdwenen Dorp', pub: 'Studio Veenkoloniaal', genre: 'True crime',
        desc: 'In 1974 verdween een Gronings gehucht van de kaart. Journalist Mirte Hoving zoekt uit waarom niemand het zich wil herinneren.',
        eps: [
          { meta: 'S1 afl. 11 · 22 sep', title: 'De laatste bewoner', dur: '41 min', prog: '' },
          { meta: 'S1 afl. 10 · 15 sep', title: 'Kaarten die niet kloppen', dur: 'nog 18 min', prog: '58%' },
          { meta: 'S1 afl. 9 · 8 sep', title: 'Het archief in Assen', dur: '44 min', prog: '' },
          { meta: 'S1 afl. 8 · 1 sep', title: 'Een brief uit 1975', dur: '39 min', prog: '' },
          { meta: 'S1 afl. 7 · 25 aug', title: 'Wie tekende de grens?', dur: '42 min', prog: '' }
        ] },
      { pal: 'pal-teal', cls: 'cv-teal', title: 'Diepzee', pub: 'Getij Media', genre: 'Wetenschap',
        desc: 'Wat leeft er op vierduizend meter diepte? Bioloog Sanne de Waal daalt af met de onderzoekers die het als eersten zagen.',
        eps: [
          { meta: 'S2 afl. 6 · 24 sep', title: 'Licht op 4000 meter', dur: '36 min', prog: '' },
          { meta: 'S2 afl. 5 · 17 sep', title: 'Het geluid van walvissen', dur: 'nog 18 min', prog: '47%' },
          { meta: 'S2 afl. 4 · 10 sep', title: 'Leven zonder zon', dur: '38 min', prog: '' },
          { meta: 'S2 afl. 3 · 3 sep', title: 'De kaart van de bodem', dur: '35 min', prog: '' },
          { meta: 'S2 afl. 2 · 27 aug', title: 'Onder druk', dur: '37 min', prog: '' }
        ] },
      { pal: 'pal-amber', cls: 'cv-amber', title: 'Goud van Oud', pub: 'Radio Zolder', genre: 'Geschiedenis',
        desc: 'Elke week één vergeten verhaal uit de vaderlandse geschiedenis, verteld aan de keukentafel met een historicus en een pot thee.',
        eps: [
          { meta: 'S4 afl. 31 · 26 sep', title: 'De eerste radio van Hilversum', dur: '52 min', prog: '' },
          { meta: 'S4 afl. 30 · 19 sep', title: 'Tulpen en schulden', dur: 'nog 18 min', prog: '64%' },
          { meta: 'S4 afl. 29 · 12 sep', title: 'Een koning op de fiets', dur: '48 min', prog: '' },
          { meta: 'S4 afl. 28 · 5 sep', title: 'Het water komt', dur: '55 min', prog: '' },
          { meta: 'S4 afl. 27 · 29 aug', title: 'De laatste trekschuit', dur: '46 min', prog: '' }
        ] }
    ];
    const start = { rood: 0, blauwgroen: 1, amber: 2 }[this.props.hoes ?? 'rood'] ?? 0;
    return { c: covers[(start + this.state.step) % 3], next: () => this.setState({ step: this.state.step + 1 }) };
  }
}
</script>
</body>
</html>
