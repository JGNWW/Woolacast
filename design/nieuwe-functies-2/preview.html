<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"><style>:root{
  --bg:#FAF6F0; --surf:#FFFDFA; --surf2:#F2EBE0; --surf3:#E8DFD1;
  --line:#E4DACA; --line2:#F0E8DC;
  --ink:#211D17; --ink2:#6E6458; --ink3:#988C7A;
  --pri:#C4542B; --priInk:#FFFDFA; --priC:#FBE3D4; --priOn:#5A2110;
  --up:#0E8A4E; --down:#C03A24;
  --appl:#C4542B; --spot:#0E8A4E; --yout:#1B6FE0;
}
*{box-sizing:border-box}
body{margin:0}
a{color:var(--pri);text-decoration:none}
a:hover{color:var(--priOn)}
.ph{width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;color:var(--ink);
  font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;text-wrap:pretty}
.dsp{font-family:'Bricolage Grotesque','Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.sa{height:48px;flex:none}
.col{display:flex;flex-direction:column}
.body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.body>*{flex:none}
.pad{padding-left:20px;padding-right:20px}
.row{display:flex;align-items:center}

/* ---- top app bar ---- */
.appbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px 0 20px;flex:none}
.mark{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pri)}
.ibtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  color:var(--ink);flex:none}
.ibtn:hover{background:var(--surf2)}
.h1{font-size:32px;font-weight:700;letter-spacing:-.022em;line-height:1.05;margin:0}
.h2{font-size:19px;font-weight:700;letter-spacing:-.014em;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* ---- source chips ---- */
.srcrow{display:flex;gap:8px;overflow:hidden}
.src{display:flex;align-items:center;gap:8px;height:44px;padding:0 15px 0 11px;border-radius:12px;
  background:var(--surf);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);
  white-space:nowrap;flex:none;cursor:pointer}
.src .dot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#FFFDFA;background:var(--ink3);flex:none}
.src.on{background:var(--ink);border-color:var(--ink);color:#FBF6EE}
.src.on .dot{background:var(--pri)}
.src.off{opacity:.42}

/* ---- context / filter bar ---- */
.ctx{display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 12px;border-radius:14px;
  background:var(--surf2);border:1px solid var(--line2);cursor:pointer}
.ctx .lbl{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.ctx .sep{color:var(--ink3)}
.flag{width:20px;height:14px;border-radius:3px;overflow:hidden;flex:none;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(33,29,23,.12) inset}
.flag i{flex:1;display:block}

/* ---- tabs ---- */
.tabs{display:flex;gap:24px;height:46px;align-items:center}
.tab{font-size:15px;font-weight:600;color:var(--ink3);height:46px;display:flex;align-items:center;
  position:relative;cursor:pointer}
.tab.on{color:var(--ink)}
.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--pri)}

/* ---- chart rows ---- */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;height:72px;border-bottom:1px solid var(--line2)}
.rank{width:26px;text-align:right;font-size:19px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink3);flex:none}
.rank.top{color:var(--pri)}
.art{width:52px;height:52px;border-radius:11px;flex:none;box-shadow:0 1px 3px rgba(33,29,23,.14)}
.meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-size:14.5px;font-weight:600;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;flex:none;width:38px;justify-content:flex-end}
.mv.new{font-size:10px;letter-spacing:.08em;color:var(--pri)}
.mv.flat{color:var(--ink3)}

/* ---- artwork ---- */
.a1{background-color:#B5482A;background-image:radial-gradient(circle at 70% 32%,#F4E3CE 0 24%,rgba(0,0,0,0) 24%)}
.a2{background-color:#14504E;background-image:linear-gradient(115deg,rgba(0,0,0,0) 40%,#E9D9B8 40% 57%,rgba(0,0,0,0) 57%)}
.a3{background-color:#DFA83A;background-image:radial-gradient(circle at 50% 106%,#25201A 0 46%,rgba(0,0,0,0) 46%)}
.a4{background-color:#332F63;background-image:repeating-linear-gradient(90deg,#EDE2CE 0 5px,rgba(0,0,0,0) 5px 15px)}
.a5{background-color:#7E3149;background-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0 21%,#F0DCC6 21% 33%,rgba(0,0,0,0) 33%)}
.a6{background-color:#3C5A2B;background-image:conic-gradient(from 200deg at 28% 72%,#DCE8C4 0 25%,rgba(0,0,0,0) 25%)}
.a7{background-color:#1E1B16;background-image:radial-gradient(circle at 50% 50%,#D9683C 0 17%,rgba(0,0,0,0) 17%);background-size:24px 24px}
.a8{background-color:#D2825A;background-image:conic-gradient(from 0deg at 100% 0%,#2A241D 0 25%,rgba(0,0,0,0) 25%)}
.a9{background-color:#2B4C7E;background-image:linear-gradient(0deg,#E7D8BE 0 33%,rgba(0,0,0,0) 33%)}
.a10{background-color:#7E5AA0;background-image:radial-gradient(circle at 24% 24%,#F2E6D4 0 19%,rgba(0,0,0,0) 19%),radial-gradient(circle at 76% 76%,#F2E6D4 0 19%,rgba(0,0,0,0) 19%)}

/* ---- buttons & chips ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:13px;
  font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--priInk)}
.btn-o{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-t{background:var(--surf2);color:var(--ink)}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;
  background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--priC);border-color:#EFC7AF;color:var(--priOn)}
.chip.dis{opacity:.38}

/* ---- mini player + bottom nav ---- */
.mini{display:flex;align-items:center;gap:12px;height:60px;margin:0 12px 6px;padding:0 8px 0 8px;border-radius:15px;
  background:var(--ink);color:#F6EFE5;box-shadow:0 6px 20px rgba(33,29,23,.22);flex:none}
.mini .art{width:44px;height:44px;border-radius:9px;box-shadow:none}
.nav{display:flex;align-items:center;justify-content:space-around;height:64px;flex:none;
  border-top:1px solid var(--line2);background:var(--bg)}
.navi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:96px;height:64px;
  color:var(--ink3);font-size:11px;font-weight:600}
.navi.on{color:var(--pri)}
.gest{height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.gest i{width:120px;height:4px;border-radius:2px;background:var(--line);display:block}

/* ---- misc ---- */
.card{background:var(--surf);border:1px solid var(--line2);border-radius:16px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.hr{height:1px;background:var(--line2)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.4}
.scroll-fade{position:absolute;left:0;right:0;height:44px;pointer-events:none}
.lbl2{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:14px 0 9px}
.ebody{flex:1 1 auto;min-width:0}

/* ---- episode rows ---- */
.erow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.erank{width:24px;text-align:right;font-size:18px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink3);padding-top:3px;flex:none}
.erank.top{color:var(--pri)}
.eart{width:56px;height:56px;border-radius:12px;flex:none;box-shadow:0 1px 3px rgba(33,29,23,.14)}
.etitle{font-size:14.5px;font-weight:600;letter-spacing:-.008em;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eshow{font-size:12.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emeta{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;color:var(--ink3);font-weight:500}
.pill{display:flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:6px;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.pbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:var(--ink);flex:none;margin-top:6px}
.sdot{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;color:#FBF6EE;flex:none}

.logo{display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;color:#FFFDFA;font-weight:800;letter-spacing:.04em;
  font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;box-shadow:inset 0 0 0 1px var(--ring)}
.logo{background:var(--c)}
.ph.dark .logo{background:var(--cd)}
.logo.mono{background:var(--surf3);color:var(--ink)}
.ph{--ring:rgba(33,29,23,.10);--tnote:var(--ink2);--panel:#211D17;--onPanel:#F6EFE5;--onPanelMuted:#B3A695;--rank:var(--pri)}
.on-mini{color:var(--onPanel)}.on-mini2{color:var(--onPanelMuted)}
/* De gloed loopt tot boven in de statusbalk (fullBleed), op 8% van de kanaalkleur. */
.glow{position:absolute;left:0;right:0;top:0;height:330px;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ch) 8%,var(--bg)) 0%,color-mix(in srgb,var(--ch) 8%,var(--bg)) 45%,var(--bg) 100%)}
.ph>*{position:relative}
.ph>.glow{position:absolute}
.fchip{height:36px;padding:0 14px;border-radius:10px;display:flex;align-items:center;font-size:13px;font-weight:600;
  color:var(--ink2);background:var(--surf);border:1px solid var(--line);white-space:nowrap;flex:none}
.fchip.on{background:var(--priC);border-color:var(--priC);color:var(--priOn)}
.schip{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.schip.dark{background:var(--panel);border-color:var(--panel);color:var(--onPanel)}
.schip svg{color:var(--ink2)}.schip.dark svg{color:var(--onPanelMuted)}
.tnote{display:flex;align-items:center;gap:6px;min-height:36px;font-size:12.5px;color:var(--tnote)}
.tnote b{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tnote .chev{display:flex;color:var(--ink2)}
.place{display:flex;align-items:center;height:26px;padding:0 8px;border-radius:7px;background:var(--surf2);
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);flex:none}
.place.none{background:transparent;color:var(--ink2);font-weight:600}
.chev{color:var(--ink2);display:flex;flex:none}
.covers{display:flex;flex:none;padding-left:6px}
.covers .art{width:26px;height:26px;border-radius:6px;margin-left:-6px;box-shadow:0 0 0 2px var(--bg)}
.btn-o{border-color:var(--line)}
.panel{background:var(--panel);border-radius:16px;padding:15px 15px 8px}
.panel .ph-t{font-size:14px;font-weight:700;color:var(--onPanel)}
.panel .ph-s{font-size:11.5px;font-weight:600;color:var(--onPanelMuted)}
.prow{display:flex;align-items:center;gap:11px;height:52px;border-top:1px solid rgba(246,239,229,.13)}
.prow .t1{font-size:13.5px;color:var(--onPanel)}.prow .t2{font-size:11.5px;color:var(--onPanelMuted)}
.pill.new{background:rgba(240,137,91,.2);color:#F0895B;letter-spacing:.04em}
.tip{padding:13px 0;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:flex-start}
.tip .src{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);font-weight:700;height:auto;padding:0;border:0;background:none}
.tip .src span{font-weight:500}
.omark{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;color:#FFFDFA;flex:none}
.tip .hl{font-size:12.5px;color:var(--ink2);line-height:17px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip .rd{font-size:12px;font-weight:700;color:var(--pri);margin-top:6px;display:flex;align-items:center;gap:4px}
.linkcard{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line2)}
.slope text{font-family:'Instrument Sans',sans-serif}

/* Donker: de tokens van Beeldgloed (Color.kt), niet het oude bruin. */
.ph.dark{--bg:#0E0F11;--surf:#16171A;--surf2:#1E1F23;--surf3:#28292E;--line:#3A3C42;--line2:rgba(237,238,240,.08);
  --ink:#EDEEF0;--ink2:#A0A3AA;--ink3:#A0A3AA;--pri:#F0895B;--priInk:#2A1006;--priC:#34363C;--priOn:#F0895B;
  --up:#5BCB8F;--down:#FF7A93;--ring:rgba(237,238,240,.16);--panel:#28292E;--onPanel:#EDEEF0;--onPanelMuted:#A0A3AA;--rank:#EDEEF0;
  background:var(--bg);color:var(--ink)}
.ph.dark .mini{background:var(--surf3);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.ph.dark .btn-p{color:#2A1006}
.ph.dark .art{box-shadow:0 1px 3px rgba(0,0,0,.5)}
.ph.dark .glow{background:linear-gradient(180deg,color-mix(in srgb,var(--ch) 16%,var(--bg)) 0%,color-mix(in srgb,var(--ch) 16%,var(--bg)) 40%,var(--bg) 100%)}

.npart{border-radius:20px;margin:0 auto;box-shadow:0 14px 36px rgba(33,29,23,.26)}
.ctxchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;background:var(--priC);color:var(--priOn);font-size:12.5px;font-weight:700}
.bar{height:5px;border-radius:3px;background:var(--surf3);position:relative}
.bar b{position:absolute;left:0;top:0;height:5px;border-radius:3px;background:var(--pri);display:block}
.bar u{position:absolute;top:-5px;width:15px;height:15px;border-radius:8px;background:var(--pri);border:3px solid var(--bg);display:block}
.bar s{position:absolute;top:-1px;width:3px;height:7px;background:var(--bg);display:block;text-decoration:none}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:600;margin-top:9px}
.tbtn{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pbig{width:72px;height:72px;border-radius:36px;background:var(--pri);color:var(--priInk);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(196,84,43,.34)}
.tools{display:flex;justify-content:space-between;align-items:center}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;height:56px;justify-content:center;color:var(--ink2);font-size:10.5px;font-weight:600}
.tool.on{color:var(--pri)}
.chap{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 10px;border-radius:12px;background:var(--surf2);font-size:13px;font-weight:600}
.chap .n{font-size:11px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.scrim{position:absolute;inset:0;background:rgba(33,29,23,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(33,29,23,.18);display:flex;flex-direction:column}
.ph>.scrim,.ph>.sheet{position:absolute}
.grab{height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--line);display:block}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px 20px}
.shead h2{font-size:19px;font-weight:700;letter-spacing:-.014em;margin:0}
.crow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2)}
.crow .ts{width:46px;font-size:12.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.crow .ct{flex:1 1 auto;font-size:14.5px;font-weight:500}
.crow.on .ct{font-weight:700}
.crow.on .ts{color:var(--pri)}
.crow.past .ct{color:var(--ink2)}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;color:var(--pri)}
.eq i{width:3px;border-radius:1px;background:currentColor;display:block}
.srow{display:flex;align-items:center;gap:14px;min-height:64px;border-bottom:1px solid var(--line2)}
.srow .ic{width:40px;height:40px;border-radius:12px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.srow .tx{flex:1 1 auto;min-width:0}
.srow .tx b{display:block;font-size:14.5px;font-weight:600}
.srow .tx span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--surf3);border:2px solid var(--ink2);position:relative;flex:none;display:block}
.sw i{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:8px;background:var(--ink2);display:block}
.sw.on{background:var(--pri);border-color:var(--pri)}
.sw.on i{left:auto;right:3px;top:3px;width:18px;height:18px;border-radius:9px;background:var(--priInk)}
.seg{display:flex;gap:6px}
.seg span{flex:1 1 0;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surf);border:1px solid var(--line);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.seg span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.saved{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surf2)}
.saved .big{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tx-line{font-size:17px;line-height:1.5;color:var(--ink2);padding:6px 10px;margin:0 -10px;border-radius:10px}
.tx-line.on{color:var(--ink);background:var(--priC);font-weight:600}
.tx-line.on mark{background:transparent;color:var(--priOn);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tx-line mark{background:#F6D9A8;color:var(--ink);border-radius:3px;padding:0 1px}
.who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:10px 0 2px}
.tsearch{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 14px;border-radius:12px;background:var(--surf2);font-size:14px;color:var(--ink)}
.tsearch .cnt{margin-left:auto;font-size:12.5px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.erow2{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:center}
.erow2 .ebody{flex:1 1 auto;min-width:0}
.dstate{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.dstate.ok{color:var(--up)}
.storage{height:10px;border-radius:5px;background:var(--surf3);display:flex;overflow:hidden}
.storage i{display:block;height:100%}
.tabs.tight{gap:17px}.tabs.tight .tab{font-size:14.5px}
.wk .flag,.note .flag{display:inline-flex;vertical-align:-2px;margin:0 3px}
