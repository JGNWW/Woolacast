name: Baseline Profile maken

# Neemt op welke code de app bij opstarten en scrollen draait, op een emulator,
# en zet het resultaat in de repo. Android compileert die code dan al bij de
# installatie. Opnieuw draaien loont na grote wijzigingen aan de schermen.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-profile
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # De emulator wil hardwareversnelling; op de runners van GitHub staat die uit.
      - name: KVM aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Licenties
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Profiel opnemen
        run: |
          ./gradlew :app:generateBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20

      - name: Wegschrijven als er iets veranderd is
        run: |
          git config user.name  "woolacast-profile"
          git config user.email "actions@users.noreply.github.com"
          git add app/src
          git diff --cached --quiet || {
            git commit -m "Baseline Profile van $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          }
