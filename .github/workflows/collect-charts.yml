name: Hitlijsten verzamelen

# Bewust alleen handmatig. Zet de cron hieronder aan als je wilt dat het
# dagelijks draait — lees eerst het stuk "Wat dit kost" in de README.
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Landcodes, door komma's gescheiden"
        default: "nl"
      limit:
        description: "Hoeveel afleveringen per categorie (max 200)"
        default: "50"
  # schedule:
  #   - cron: "20 5 * * *"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verzamelen
        working-directory: charts-service
        env:
          COUNTRIES: ${{ inputs.countries || 'nl' }}
          LIMIT: ${{ inputs.limit || '50' }}
        run: |
          for cc in ${COUNTRIES//,/ }; do
            echo "::group::$cc"
            python3 collect.py --country "$cc" --limit "$LIMIT" --out charts
            echo "::endgroup::"
          done

      - name: Wegschrijven als er iets veranderd is
        run: |
          git config user.name  "woolacast-charts"
          git config user.email "actions@users.noreply.github.com"
          git add charts-service/charts
          if git diff --cached --quiet; then
            echo "niets veranderd"
          else
            git commit -m "Hitlijsten van $(date -u +%Y-%m-%d)"
            git push
          fi
